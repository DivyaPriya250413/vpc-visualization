<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPC Visual – an AWS VPC explained as a gated housing society</title>
  <meta name="description" content="An animated, beginner-friendly diagram that explains an AWS VPC step by step.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Steps">
      <div class="brand">
        <h1>VPC Visual</h1>
        <p>Divyapriya's shop lives in a gated housing society. Follow along.</p>
      </div>
      <nav id="steps" class="steps" aria-label="Step buttons"></nav>
      <div class="controls">
        <button id="auto" type="button" class="ctl">Auto-play</button>
        <button id="reset" type="button" class="ctl">Reset</button>
      </div>
      <div class="legend" id="legend" aria-label="Legend"></div>
    </aside>
    <main class="main">
      <div class="stage-wrap"><svg id="stage" class="stage" viewBox="0 0 1100 620" role="img" aria-label="Animated AWS VPC diagram"></svg></div>
      <section class="caption" aria-live="polite">
        <h2 id="c-title"></h2>
        <div class="grid">
          <div><h3>In plain words</h3><p id="c-plain"></p></div>
          <div><h3>Technical name</h3><p id="c-tech"></p></div>
          <div><h3>Watch the picture</h3><p id="c-watch"></p></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
